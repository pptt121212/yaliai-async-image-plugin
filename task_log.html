<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>鸭梨AI图像生成插件(低价版) - 任务日志</title>
  <link rel="stylesheet" href="../../../plugin-sdk.css">
  <style>
    body { padding: 16px 20px; }
    h3 { margin: 0 0 12px; }
    .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .toolbar input { min-width: 220px; }
    .toolbar select { width: auto; min-width: 120px; }
    .toolbar .spacer { flex: 1; }
    .meta { color: var(--text-muted); font-size: 11px; }
    .table-wrap { overflow: auto; max-height: calc(100vh - 150px); }
    table { width: 100%; min-width: 1090px; border-collapse: collapse; }
    th { position: sticky; top: 0; background: var(--bg-primary); text-align: left; white-space: nowrap; }
    td, th { padding: 7px 8px; border-bottom: 1px solid var(--border-color); vertical-align: top; font-size: 12px; }
    .select-col { width: 30px; text-align: center; }
    .task-id { width: 132px; max-width: 132px; font-family: monospace; white-space: normal; overflow-wrap: anywhere; word-break: break-all; }
    .storyboard { width: 132px; min-width: 132px; max-width: 148px; color: var(--text-muted); white-space: normal; overflow-wrap: anywhere; word-break: break-word; }
    .model { width: 175px; min-width: 175px; max-width: 190px; white-space: normal; overflow-wrap: anywhere; }
    .time { white-space: nowrap; }
    .status { white-space: nowrap; }
    .detail { max-width: 360px; word-break: break-word; }
    .detail a { color: var(--primary-color); display: block; margin-top: 3px; }
    .prompt { max-width: 280px; color: var(--text-muted); word-break: break-word; }
    .preview { width: 96px; height: 72px; object-fit: contain; background: var(--bg-secondary); display: block; margin-bottom: 4px; }
    .image-pair { display: flex; gap: 8px; flex-wrap: wrap; }
    .image-item { min-width: 96px; max-width: 110px; }
    .image-label { color: var(--text-muted); font-size: 11px; margin-bottom: 3px; }
    .missing-preview { width: 96px; min-height: 50px; padding: 5px; background: var(--bg-secondary); color: var(--text-muted); font-size: 11px; line-height: 1.35; }
    .error { color: var(--danger); }
    .upscale-btn { margin-top: 7px; width: 100%; font-size: 12px; }
    .local-open-btn { margin-top: 5px; width: 100%; font-size: 12px; }
    .upscaled-badge { display: inline-block; margin-top: 7px; color: var(--text-muted); font-size: 12px; }
    .in-progress { display: inline-block; margin-top: 7px; color: var(--primary-color); font-size: 12px; }
    .batch-upscale-btn { white-space: nowrap; }
    .action-status { min-height: 17px; color: var(--text-muted); font-size: 11px; }
    .action-status.error { color: var(--danger); }
    .pager { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px; }
    .empty { color: var(--text-muted); text-align: center; padding: 36px; }
  </style>
</head>
<body>
  <h3>鸭梨AI图像生成插件(低价版) - 任务日志</h3>
  <div class="toolbar">
    <select id="statusFilter">
      <option value="">全部状态</option>
      <option value="queued">排队中</option>
      <option value="processing">处理中</option>
      <option value="completed">上游已完成</option>
      <option value="success">已交付</option>
      <option value="download_failed">交付失败</option>
      <option value="failed">生成失败</option>
      <option value="timeout">超时</option>
      <option value="cancelled">已取消</option>
    </select>
    <input id="taskIdInput" type="search" placeholder="搜索任务 ID">
    <button id="searchBtn" type="button">查询</button>
    <button id="batchUpscaleBtn" class="batch-upscale-btn" type="button" disabled>批量超分 (0)</button>
    <button id="clearOldBtn" type="button">清理 30 天前</button>
    <button id="clearAllBtn" type="button">清空日志</button>
    <span class="action-status" id="actionStatus"></span>
    <span class="spacer"></span>
    <span class="meta" id="countLabel"></span>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th class="select-col"><input id="selectAll" type="checkbox" title="选择当前页可超分任务"></th>
          <th>任务 ID</th>
          <th>分镜关联</th>
          <th>模型与参数</th>
          <th>状态</th>
          <th>更新时间</th>
          <th>提示词预览</th>
          <th>图片 / 追踪 / 错误</th>
        </tr>
      </thead>
      <tbody id="logBody"></tbody>
    </table>
    <div class="empty" id="emptyHint" hidden>暂无任务记录</div>
  </div>

  <div class="pager">
    <button id="prevBtn" type="button">上一页</button>
    <span class="meta" id="pageLabel">第 1 / 1 页</span>
    <button id="nextBtn" type="button">下一页</button>
  </div>

  <script>
    var PopupComm = {
      _handlers: {},
      send: function (action, data) {
        if (window.opener) window.opener.postMessage({ __typetale_plugin: true, type: 'plugin_action', action: action, data: data || {} }, '*')
      },
      onAction: function (action, callback) {
        if (!this._handlers[action]) this._handlers[action] = []
        this._handlers[action].push(callback)
      }
    }
    window.addEventListener('message', function (event) {
      var data = event.data
      if (!data || data.__typetale_plugin !== true || data.type !== 'action') return
      ;(PopupComm._handlers[data.action] || []).forEach(function (callback) { try { callback(data.data) } catch (error) {} })
    })

    var page = 1
    var pageSize = 20
    var statusFilter = document.getElementById('statusFilter')
    var taskIdInput = document.getElementById('taskIdInput')
    var logBody = document.getElementById('logBody')
    var emptyHint = document.getElementById('emptyHint')
    var actionStatus = document.getElementById('actionStatus')
    var selectedTaskIds = new Set()
    var selectAll = document.getElementById('selectAll')
    var batchUpscaleBtn = document.getElementById('batchUpscaleBtn')
    var activeManualPollTimer = null

    function setActionStatus(message, isError) {
      actionStatus.textContent = String(message || '')
      actionStatus.classList.toggle('error', !!isError)
    }
    function updateBatchControls(tasks) {
      var eligible = (tasks || []).filter(function (task) {
        return !!task.can_manual_upscale
      })
      var eligibleIds = eligible.map(function (task) { return String(task.task_id) })
      var selectedOnPage = eligibleIds.filter(function (taskId) { return selectedTaskIds.has(taskId) })
      selectAll.checked = eligibleIds.length > 0 && selectedOnPage.length === eligibleIds.length
      selectAll.indeterminate = selectedOnPage.length > 0 && selectedOnPage.length < eligibleIds.length
      selectAll.disabled = eligibleIds.length === 0
      batchUpscaleBtn.disabled = selectedTaskIds.size === 0
      batchUpscaleBtn.textContent = '批量超分 (' + selectedTaskIds.size + ')'
    }

    function esc(value) {
      var element = document.createElement('div')
      element.textContent = value == null ? '' : String(value)
      return element.innerHTML
    }
    function formatTime(value) {
      if (!value) return '-'
      return new Date(Number(value) * 1000).toLocaleString()
    }
    function localFileUrl(value) {
      if (!value) return ''
      if (/^https?:\/\//i.test(value)) return value
      return 'file:///' + String(value).replace(/\\/g, '/')
    }
    function storyboardReference(task) {
      var uniqueName = String(task.unique_name || '').trim()
      var viewerIndex = Number(task.viewer_index || 0)
      var outputPosition = Number(task.output_position || 0)
      var parts = []
      if (viewerIndex > 0) parts.push('分镜序号 ' + viewerIndex)
      else if (/^character_/i.test(uniqueName)) parts.push('角色生成')
      else parts.push('独立任务')
      if (uniqueName) parts.push('标识 ' + uniqueName)
      if (Number.isFinite(outputPosition) && outputPosition >= 0) parts.push('图位 ' + (outputPosition + 1))
      return parts.map(esc).join('<br>')
    }
    function loadLogs() {
      PopupComm.send('get_task_logs', {
        page: page,
        page_size: pageSize,
        status: statusFilter.value,
        task_id: taskIdInput.value.trim()
      })
    }
    function isActiveManualUpscale(task) {
      if (!task || task.generation_mode !== 'manual_upscale') return false
      return ['queued', 'pending', 'processing', 'running', 'completed'].indexOf(String(task.status || '').toLowerCase()) >= 0
    }
    function manualUpscaleStatusText(task) {
      var status = String(task.status || '').toLowerCase()
      if (status === 'queued' || status === 'pending') return '超分排队中'
      if (status === 'processing' || status === 'running') return '超分生成中'
      if (status === 'completed') return '下载并替换中'
      return String(task.status || task.event || '-')
    }
    function updateManualUpscalePolling(tasks) {
      var active = (tasks || []).some(isActiveManualUpscale)
      if (active && !activeManualPollTimer) {
        activeManualPollTimer = setInterval(loadLogs, 2000)
      } else if (!active && activeManualPollTimer) {
        clearInterval(activeManualPollTimer)
        activeManualPollTimer = null
      }
      if (active) {
        var current = (tasks || []).find(isActiveManualUpscale)
        setActionStatus(manualUpscaleStatusText(current) + '，完成后会自动下载并替换原图。', false)
      }
    }
    function renderLogs(data) {
      var tasks = data.tasks || []
      logBody.innerHTML = ''
      emptyHint.hidden = tasks.length !== 0
      document.getElementById('countLabel').textContent = '共 ' + (data.total || 0) + ' 个任务'
      document.getElementById('pageLabel').textContent = '第 ' + (data.page || 1) + ' / ' + (data.total_pages || 1) + ' 页'
      document.getElementById('prevBtn').disabled = (data.page || 1) <= 1
      document.getElementById('nextBtn').disabled = (data.page || 1) >= (data.total_pages || 1)
      updateBatchControls(tasks)
      updateManualUpscalePolling(tasks)
      tasks.forEach(function (task) {
        var row = document.createElement('tr')
        var localImageUrl = String(task.local_preview_data_url || '')
        var sourceTask = task.source_task || null
        var manualWorkflow = task.workflow_type === 'manual_upscale'
        var isManualPending = manualWorkflow && isActiveManualUpscale(task)
        var sourceImageUrl = sourceTask ? String(sourceTask.local_preview_data_url || '') : ''
        var image = localImageUrl ? '<div class="image-item"><div class="image-label">' + (sourceTask ? (manualWorkflow ? '超分结果' : '超分图') : '结果图') + '</div><img class="preview" src="' + esc(localImageUrl) + '" alt="本地图片缩略图"></div>' : ''
        var sourceLabel = manualWorkflow ? '原图' : '基础图'
        var sourceImage = sourceTask ? (sourceImageUrl ? '<div class="image-item"><div class="image-label">' + sourceLabel + '</div><img class="preview" src="' + esc(sourceImageUrl) + '" alt="原图缩略图"></div>' : '<div class="image-item"><div class="image-label">' + sourceLabel + '</div><div class="missing-preview">本地预览已清理</div></div>') : ''
        var localLink = task.local_image_exists ? '<button class="local-open-btn" type="button" data-open-local-task="' + esc(task.task_id) + '">在本地打开</button>' : ''
        var sourceLocalLink = sourceTask && sourceTask.local_image_exists && !task.local_image_exists ? '<button class="local-open-btn" type="button" data-open-local-task="' + esc(sourceTask.task_id) + '">在本地打开原图</button>' : ''
        var links = (task.output_urls || []).map(function (url) {
          return '<a href="' + esc(url) + '" target="_blank" rel="noreferrer">打开图片 URL</a>'
        }).join('')
        var sourceLinks = sourceTask ? (sourceTask.output_urls || []).map(function (url) {
          return '<a href="' + esc(url) + '" target="_blank" rel="noreferrer">打开' + sourceLabel + ' URL</a>'
        }).join('') : ''
        var canUpscale = !!task.can_manual_upscale
        var checkbox = canUpscale ? '<input class="task-select" type="checkbox" data-task-select="' + esc(task.task_id) + '"' + (selectedTaskIds.has(String(task.task_id)) ? ' checked' : '') + '>' : ''
        var action = canUpscale ? '<button class="upscale-btn" type="button" data-upscale-task="' + esc(task.task_id) + '">超分并替换</button>' : ''
        var stateLabel = task.upscale_state === 'already_upscaled' ? '<span class="upscaled-badge">已超分</span>' : (task.upscale_state === 'superseded' ? '<span class="upscaled-badge">已被后续结果替换</span>' : '')
        var processingHint = isManualPending ? '<span class="in-progress">超分处理中，完成后自动替换原图</span>' : ''
        var result = (sourceTask ? '<div class="image-pair">' + sourceImage + image + '</div>' : image) + localLink + sourceLocalLink + sourceLinks + links + processingHint + action + stateLabel + (task.error ? '<span class="error">' + esc(task.error) + '</span>' : '')
        var stage = task.pipeline_stage === 'source' ? 'A 中间' : (task.pipeline_stage === 'upscale' ? 'B 最终' : (task.pipeline_stage === 'manual_upscale' ? '手动超分' : '单阶段'))
        var settings = esc(stage) + '<br>' + esc(task.model || '-') + '<br>' + esc(task.request_size || task.image_size || '-') + ' / ' + esc(task.aspect_ratio || '-') + '<br>画质 ' + esc(task.quality || '-') + '<br>参考图 ' + esc(task.reference_image_count || 0)
        if (sourceTask) settings = (manualWorkflow ? '原图<br>' : 'A 基础<br>') + esc(sourceTask.model || '-') + '<br>' + esc(sourceTask.request_size || sourceTask.image_size || '-') + ' / ' + esc(sourceTask.aspect_ratio || '-') + '<hr>' + (manualWorkflow ? '手动超分<br>' : 'B 超分<br>') + settings
        var mode = task.generation_mode === 'upscale' ? '超分' : (task.generation_mode === 'manual_upscale' ? '手动超分' : '默认')
        settings = esc(mode) + '<br>' + settings
        row.innerHTML =
          '<td class="select-col">' + checkbox + '</td>' +
          '<td class="task-id">' + (sourceTask ? (manualWorkflow ? '超分 ' : 'B ') : '') + esc(task.task_id) + (sourceTask ? '<br><span class="meta">' + (manualWorkflow ? '原图 ' : 'A ') + esc(sourceTask.task_id) + '</span>' : '') + '</td>' +
          '<td class="storyboard">' + storyboardReference(task) + '</td>' +
          '<td class="model">' + settings + '</td>' +
          '<td class="status">' + esc(manualWorkflow ? manualUpscaleStatusText(task) : (task.status || task.event || '-')) + '<br>事件 ' + esc(task.event_count || 0) + '</td>' +
          '<td class="time">' + esc(formatTime(task.updated_at)) + '</td>' +
          '<td class="prompt" title="' + esc(task.prompt_preview || '') + '">' + esc(task.prompt_preview || '-') + '</td>' +
          '<td class="detail">' + result + '</td>'
        logBody.appendChild(row)
      })
    }

    PopupComm.onAction('get_task_logs', function (data) { if (data && data.ok) renderLogs(data) })
    PopupComm.onAction('clear_task_logs', function (data) {
      if (data && data.ok) { page = 1; loadLogs() }
    })
    PopupComm.onAction('start_manual_upscale', function (data) {
      if (data && data.ok) {
        setActionStatus(data.message || '已提交超分任务', false)
        setTimeout(loadLogs, 1200)
      } else if (data) {
        setActionStatus(data.error || '超分任务无法提交', true)
      }
    })
    PopupComm.onAction('start_manual_upscale_batch', function (data) {
      if (data && data.ok) {
        selectedTaskIds.clear()
        setActionStatus(data.message || '已提交批量超分任务', false)
        setTimeout(loadLogs, 1200)
      } else if (data) {
        setActionStatus(data.error || '批量超分无法提交', true)
      }
    })
    PopupComm.onAction('open_local_task_image', function (data) {
      if (data && data.ok) setActionStatus(data.message || '已打开本地图片', false)
      else if (data) setActionStatus(data.error || '无法打开本地图片', true)
    })
    document.getElementById('searchBtn').addEventListener('click', function () { page = 1; loadLogs() })
    statusFilter.addEventListener('change', function () { page = 1; loadLogs() })
    taskIdInput.addEventListener('keydown', function (event) { if (event.key === 'Enter') { page = 1; loadLogs() } })
    document.getElementById('prevBtn').addEventListener('click', function () { if (page > 1) { page--; loadLogs() } })
    document.getElementById('nextBtn').addEventListener('click', function () { page++; loadLogs() })
    document.getElementById('clearOldBtn').addEventListener('click', function () {
      if (window.confirm('只清理 30 天前的任务日志，不会删除图片文件。继续吗？')) PopupComm.send('clear_task_logs', { mode: 'before', days: 30 })
    })
    document.getElementById('clearAllBtn').addEventListener('click', function () {
      if (window.confirm('清空全部任务日志？不会删除图片文件。')) PopupComm.send('clear_task_logs', { mode: 'all' })
    })
    logBody.addEventListener('click', function (event) {
      var localButton = event.target.closest('[data-open-local-task]')
      if (localButton) {
        setActionStatus('正在打开本地图片...', false)
        PopupComm.send('open_local_task_image', { task_id: localButton.getAttribute('data-open-local-task') })
        return
      }
      var checkbox = event.target.closest('[data-task-select]')
      if (checkbox) {
        var selectedId = String(checkbox.getAttribute('data-task-select'))
        if (checkbox.checked) selectedTaskIds.add(selectedId)
        else selectedTaskIds.delete(selectedId)
        updateBatchControls(Array.prototype.slice.call(logBody.querySelectorAll('[data-task-select]')).map(function (input) {
          return { task_id: input.getAttribute('data-task-select'), can_manual_upscale: true }
        }))
        return
      }
      var button = event.target.closest('[data-upscale-task]')
      if (!button) return
      var taskId = button.getAttribute('data-upscale-task')
      if (!window.confirm('将只调用超分模型，不会重新生成基础图。成功后原图会备份到 .yaliai-backups，并替换当前分镜图片。继续吗？')) return
      button.disabled = true
      setActionStatus('正在提交超分任务...', false)
      PopupComm.send('start_manual_upscale', { task_id: taskId })
      setTimeout(function () { button.disabled = false }, 1500)
    })
    selectAll.addEventListener('change', function () {
      logBody.querySelectorAll('[data-task-select]').forEach(function (input) {
        var taskId = String(input.getAttribute('data-task-select'))
        input.checked = selectAll.checked
        if (selectAll.checked) selectedTaskIds.add(taskId)
        else selectedTaskIds.delete(taskId)
      })
      batchUpscaleBtn.disabled = selectedTaskIds.size === 0
      batchUpscaleBtn.textContent = '批量超分 (' + selectedTaskIds.size + ')'
    })
    batchUpscaleBtn.addEventListener('click', function () {
      var taskIds = Array.from(selectedTaskIds)
      if (!taskIds.length) return
      if (!window.confirm('将只调用当前设置的超分模型，并继承每张本地原图比例。成功后会备份并替换 ' + taskIds.length + ' 张分镜图片。继续吗？')) return
      batchUpscaleBtn.disabled = true
      setActionStatus('正在提交 ' + taskIds.length + ' 个超分任务...', false)
      PopupComm.send('start_manual_upscale_batch', { task_ids: taskIds })
      setTimeout(function () { updateBatchControls([]) }, 1500)
    })
    window.addEventListener('beforeunload', function () {
      if (activeManualPollTimer) clearInterval(activeManualPollTimer)
    })
    loadLogs()
  </script>
</body>
</html>
