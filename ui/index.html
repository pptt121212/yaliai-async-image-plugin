<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>字字动画免费图像生成插件（自定义API版本）</title>
  <link rel="stylesheet" href="../../../plugin-sdk.css">
  <script src="../../../plugin-sdk.js"></script>
  <style>
    .api-key-wrapper { position: relative; display: flex; align-items: center; }
    .api-key-wrapper input { flex: 1; padding-right: 36px; }
    .toggle-eye { position: absolute; right: 8px; background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 14px; padding: 2px 4px; }
    .task-log { margin-top: 14px; }
    .plugin-actions { display: flex; gap: 8px; margin-top: 14px; }
    .reference-box { margin-top: 14px; padding: 12px; border: 1px solid var(--border-color); border-radius: var(--radius); background: var(--bg-secondary); }
    .reference-box h4 { margin: 0 0 6px; font-size: 13px; }
    .reference-box input[type=file] { width: 100%; }
    .reference-list { margin-top: 8px; color: var(--text-muted); font-size: 11px; line-height: 1.5; word-break: break-word; }
    .reference-actions { display: flex; gap: 8px; margin-top: 8px; }
    .reference-actions button { flex: 1; }
    .reference-status { min-height: 17px; margin-top: 7px; color: var(--text-muted); font-size: 11px; line-height: 1.45; }
    .reference-status.error { color: var(--danger, #d9534f); }
    .upscale-prompt { min-height: 120px; resize: vertical; font-family: inherit; }
    .field-hint { margin-top: 5px; color: var(--text-muted); font-size: 11px; line-height: 1.4; }
    .upscale-hint { margin: 8px 0 12px; color: var(--text-secondary); font-size: 12px; line-height: 1.5; }
    .upscale-hint[hidden] { display: none; }
    .mode-options { display: flex; gap: 6px; }
    .mode-btn {
      flex: 1;
      padding: 6px 0;
      text-align: center;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s;
      font-size: 12px;
    }
    .mode-btn:hover { border-color: #5a5d70; color: var(--text-primary); }
    .mode-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .form-row[hidden] { display: none; }
    .settings-backdrop { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(0, 0, 0, 0.45); }
    .settings-backdrop[hidden] { display: none; }
    .settings-dialog { width: min(100%, 480px); max-height: calc(100vh - 32px); overflow: auto; padding: 16px; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: var(--radius); }
    .settings-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .settings-header h3 { margin: 0; }
  </style>
</head>
<body>
  <h3>字字动画免费图像生成插件（自定义API版本）</h3>

  <section class="reference-box" aria-labelledby="referenceTitle">
    <h4 id="referenceTitle">全局参考图（可选）</h4>
    <div class="field-hint">参考图将用于所有图片生成，并作为最后一张参考图提交。</div>
    <input id="referenceImageInput" type="file" accept="image/*" multiple>
    <div id="referenceImageList" class="reference-list">未配置参考图</div>
    <div class="reference-actions">
      <button id="clearReferenceImages" type="button">清空参考图</button>
    </div>
    <div id="referenceStatus" class="reference-status" role="status" aria-live="polite"></div>
  </section>

  <div class="form-row">
    <label class="form-label">生成模式</label>
    <div class="form-control">
      <div class="mode-options" role="group" aria-label="生成模式">
        <button class="mode-btn active" type="button" data-mode="default" aria-pressed="true">默认（单模型）</button>
        <button class="mode-btn" type="button" data-mode="upscale" aria-pressed="false">超分</button>
      </div>
    </div>
  </div>

  <div class="form-row">
    <label class="form-label">模型</label>
    <div class="form-control"><select id="modelSelect">
      <option value="gemini-3.1-flash-image-preview">gemini-3.1-flash-image-preview</option>
      <option value="gemini-3-pro-image-preview">gemini-3-pro-image-preview</option>
      <option value="gpt-image-2">gpt-image-2</option>
    </select></div>
  </div>

  <div class="form-row">
    <label class="form-label">画质</label>
    <div class="form-control"><select id="qualitySelect">
      <option value="low">低</option>
      <option value="medium">中</option>
      <option value="high">高</option>
    </select></div>
  </div>

  <div class="form-row">
    <label class="form-label">图像档位</label>
    <div class="form-control"><select id="imageSizeSelect">
      <option value="1K">1K</option>
      <option value="2K">2K</option>
      <option value="4K">4K</option>
    </select></div>
  </div>

  <div class="form-row">
    <label class="form-label">图像比例</label>
    <div class="form-control"><select id="aspectRatioSelect">
      <option value="auto">自动</option>
      <option value="1:1">1:1</option>
      <option value="16:9">16:9</option>
      <option value="9:16">9:16</option>
      <option value="4:3">4:3</option>
      <option value="3:4">3:4</option>
      <option value="3:2">3:2</option>
      <option value="2:3">2:3</option>
      <option value="5:4">5:4</option>
      <option value="4:5">4:5</option>
      <option value="21:9">21:9</option>
    </select></div>
  </div>

  <div class="form-row" id="upscaleModelRow" hidden>
    <label class="form-label">超分模型</label>
    <div class="form-control"><select id="upscaleModelSelect">
      <option value="gemini-3.1-flash-image-preview">gemini-3.1-flash-image-preview</option>
      <option value="gemini-3-pro-image-preview">gemini-3-pro-image-preview</option>
      <option value="gpt-image-2">gpt-image-2</option>
    </select></div>
  </div>

  <div class="form-row" id="upscaleImageSizeRow" hidden>
    <label class="form-label">超分目标档位</label>
    <div class="form-control"><select id="upscaleImageSizeSelect">
      <option value="2K">2K</option>
      <option value="4K">4K</option>
    </select></div>
  </div>

  <p class="upscale-hint" id="upscaleRuleHint" hidden></p>

  <div class="form-row" id="upscalePromptRow" hidden>
    <label class="form-label">超分提示词</label>
    <div class="form-control">
      <textarea class="upscale-prompt" id="upscalePromptInput" placeholder="支持 {{image_size}} 和 {{aspect_ratio}} 变量"></textarea>
      <div class="field-hint">可使用变量：{image_size}（图像档位）和 {aspect_ratio}（图像比例）。</div>
    </div>
  </div>

  <p class="upscale-hint" id="upscaleHint" hidden>超分模式会先使用默认模型生成基础图片，再使用超分模型生成最终图片。</p>

  <div class="plugin-actions">
    <button id="openTaskLog" type="button">打开任务日志</button>
    <button id="openSettings" type="button">设置</button>
  </div>

  <div class="settings-backdrop" id="settingsPanel" hidden>
    <section class="settings-dialog" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="settings-header">
        <h3 id="settingsTitle">设置</h3>
        <button id="closeSettings" type="button">关闭</button>
      </div>
      <div class="form-row">
        <label class="form-label">API URL</label>
        <div class="form-control"><input type="url" id="endpointInput" placeholder="https://api.yaliai.com"></div>
      </div>
      <div class="form-row">
        <label class="form-label">GPT KEY</label>
        <div class="form-control"><div class="api-key-wrapper">
          <input type="password" id="gptApiKeyInput" placeholder="请输入 GPT-image-2 租户 API Key">
          <button class="toggle-eye" type="button" data-target="gptApiKeyInput" aria-label="显示或隐藏 GPT-image-2 API Key">显示</button>
        </div></div>
      </div>
      <div class="form-row">
        <label class="form-label">GEMINI KEY</label>
        <div class="form-control"><div class="api-key-wrapper">
          <input type="password" id="geminiApiKeyInput" placeholder="请输入 Gemini 租户 API Key">
          <button class="toggle-eye" type="button" data-target="geminiApiKeyInput" aria-label="显示或隐藏 Gemini API Key">显示</button>
        </div></div>
      </div>
      <div class="form-row">
        <label class="form-label">本地结果压缩上限</label>
        <div class="form-control"><input type="number" id="localResultMaxMbInput" min="1" max="50" step="0.5" inputmode="decimal" aria-describedby="localResultMaxMbHint"></div>
      </div>
      <p class="field-hint" id="localResultMaxMbHint">新生成图片超限时转为 JPEG，保持比例；手动超分替换原图时保持原后缀。默认 5 MB。</p>
      <p class="field-hint">单张参考图不超过 2 MB 时原样上传；超过 2 MB 时安全压缩后上传，保持比例且不修改原文件。</p>
    </section>
  </div>

  <script>
    var defaults = {
      endpoint: 'https://api.yaliai.com',
      model: 'gemini-3.1-flash-image-preview',
      aspect_ratio: '16:9',
      image_size: '4K',
      quality: 'medium',
      generation_mode: 'default',
      upscale_model: 'gemini-3-pro-image-preview',
      upscale_image_size: '4K',
      local_result_max_mb: 5,
      upscale_prompt: '现在对这张图进行全景像素超分（Panorama Super-Resolution）与重绘。请将图像精细度和文字边缘细节提升至 {{image_size}} 电影级分辨率。场景清晰不允许存在锯齿和噪点，颜色纯净。请在画面中原地追加细节。保持图像 {{aspect_ratio}} 比例，不要因为限制图像比例而使用变形的素材和文字。图像比例不对将判定为任务失败！'
    }
    var fields = {
      endpoint: document.getElementById('endpointInput'),
      gpt_api_key: document.getElementById('gptApiKeyInput'),
      gemini_api_key: document.getElementById('geminiApiKeyInput'),
      local_result_max_mb: document.getElementById('localResultMaxMbInput'),
      model: document.getElementById('modelSelect'),
      upscale_model: document.getElementById('upscaleModelSelect'),
      upscale_image_size: document.getElementById('upscaleImageSizeSelect'),
      upscale_prompt: document.getElementById('upscalePromptInput'),
      quality: document.getElementById('qualitySelect'),
      image_size: document.getElementById('imageSizeSelect'),
      aspect_ratio: document.getElementById('aspectRatioSelect')
    }
    var modeButtons = document.querySelectorAll('.mode-btn')
    var currentGenerationMode = 'default'
    var settingsPanel = document.getElementById('settingsPanel')
    var sdkReady = false
    var referenceInput = document.getElementById('referenceImageInput')
    var referenceList = document.getElementById('referenceImageList')
    var referenceStatus = document.getElementById('referenceStatus')
    var upscaleRuleHint = document.getElementById('upscaleRuleHint')

    function setStatus(message, isError) {
      referenceStatus.textContent = String(message || '')
      referenceStatus.classList.toggle('error', !!isError)
    }

    function formatBytes(bytes) {
      var value = Number(bytes || 0)
      if (value < 1024) return value + ' B'
      if (value < 1024 * 1024) return (value / 1024).toFixed(1) + ' KB'
      return (value / (1024 * 1024)).toFixed(1) + ' MB'
    }

    function readAsDataUrl(file) {
      return new Promise(function (resolve, reject) {
        var reader = new FileReader()
        reader.onload = function () { resolve(String(reader.result || '')) }
        reader.onerror = function () { reject(new Error('读取参考图失败')) }
        reader.readAsDataURL(file)
      })
    }

    function renderReferenceList(images) {
      images = Array.isArray(images) ? images : []
      if (!images.length) {
        referenceList.textContent = '未配置参考图'
        return
      }
      referenceList.textContent = '已配置 ' + images.length + ' 张：' + images.map(function (item) {
        return (item.name || 'reference') + ' (' + formatBytes(item.size) + ')'
      }).join('、')
    }

    async function refreshReferenceList() {
      if (!sdkReady) return
      var result = await PluginSDK.sendAction('get_configured_references', {}, { timeoutMs: 10000 })
      renderReferenceList(result && result.images)
    }

    async function saveReferenceFiles(files) {
      if (!sdkReady || !files.length) return
      if (files.length > 8) throw new Error('最多选择 8 张参考图')
      var images = []
      for (var i = 0; i < files.length; i++) {
        images.push({ name: files[i].name, data_url: await readAsDataUrl(files[i]) })
      }
      var result = await PluginSDK.sendAction('save_configured_references', { images: images }, { timeoutMs: 120000 })
      if (!result || result.ok === false) throw new Error((result && result.error) || '参考图保存失败')
      renderReferenceList(result.images)
    }

    function updateUpscaleVisibility() {
      var enabled = currentGenerationMode === 'upscale'
      document.getElementById('upscaleModelRow').hidden = !enabled
      document.getElementById('upscaleImageSizeRow').hidden = !enabled
      document.getElementById('upscalePromptRow').hidden = !enabled
      document.getElementById('upscaleHint').hidden = !enabled
      upscaleRuleHint.hidden = !enabled
      updateUpscaleRuleHint()
    }

    function updateUpscaleRuleHint() {
      var source = String(fields.image_size.value || '4K')
      var target = String(fields.upscale_image_size.value || '4K')
      upscaleRuleHint.textContent = '当前规则：先生成 ' + source + ' 基础图，再由超分模型生成 ' + target + ' 最终图。'
    }

    function setGenerationMode(mode, persist) {
      currentGenerationMode = mode === 'upscale' ? 'upscale' : 'default'
      modeButtons.forEach(function (button) {
        var active = button.dataset.mode === currentGenerationMode
        button.classList.toggle('active', active)
        button.setAttribute('aria-pressed', active ? 'true' : 'false')
      })
      updateUpscaleVisibility()
      if (persist && sdkReady) {
        try { PluginSDK.saveParam('generation_mode', currentGenerationMode) } catch (error) {}
      }
    }

    function selectValue(element, value) {
      for (var i = 0; i < element.options.length; i++) {
        if (element.options[i].value === String(value)) {
          element.selectedIndex = i
          return true
        }
      }
      return false
    }

    function save(key) {
      if (!sdkReady) return
      var value = String(fields[key].value || '').trim()
      try { PluginSDK.saveParam(key, value) } catch (error) {}
    }

    function applyParams(params) {
      params = params || {}
      Object.keys(fields).forEach(function (key) {
        var value = params[key]
        if ((value === undefined || value === null || value === '') && defaults[key] !== undefined) value = defaults[key]
        if (value === undefined || value === null) return
        if (fields[key].tagName === 'SELECT') selectValue(fields[key], value)
        else fields[key].value = value
      })
      setGenerationMode(params.generation_mode || defaults.generation_mode, false)
      // Read old installations without displaying or saving the legacy field.
      if (!params.gpt_api_key && !params.gemini_api_key && params.api_key) {
        fields.gpt_api_key.value = params.api_key
        fields.gemini_api_key.value = params.api_key
      } else if (!params.gpt_api_key && params.api_key) {
        fields.gpt_api_key.value = params.api_key
      } else if (!params.gemini_api_key && params.api_key) {
        fields.gemini_api_key.value = params.api_key
      }
    }

    document.querySelectorAll('.toggle-eye').forEach(function (button) {
      button.addEventListener('click', function () {
        var input = document.getElementById(button.getAttribute('data-target'))
        input.type = input.type === 'password' ? 'text' : 'password'
        button.textContent = input.type === 'password' ? '显示' : '隐藏'
      })
    })
    Object.keys(fields).forEach(function (key) {
      fields[key].addEventListener('change', function () {
        if (key === 'image_size' || key === 'upscale_image_size') updateUpscaleRuleHint()
        save(key)
      })
    })
    modeButtons.forEach(function (button) {
      button.addEventListener('click', function () { setGenerationMode(button.dataset.mode, true) })
    })
    document.getElementById('openSettings').addEventListener('click', function () {
      settingsPanel.hidden = false
      fields.endpoint.focus()
    })
    document.getElementById('closeSettings').addEventListener('click', function () {
      settingsPanel.hidden = true
    })
    settingsPanel.addEventListener('click', function (event) {
      if (event.target === settingsPanel) settingsPanel.hidden = true
    })
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape' && !settingsPanel.hidden) settingsPanel.hidden = true
    })
    PluginSDK.onAction('load_params', function (result) { if (result && result.ok) applyParams(result.params) })
    document.getElementById('openTaskLog').addEventListener('click', function () {
      if (!sdkReady) return
      PluginSDK.sendAction('open_task_logs', {}, { timeoutMs: 15000 }).then(function (result) {
        // The host may create the popup before its iframe reply reaches this
        // panel. Do not turn that completed UI action into a false failure.
        if (result && result.ok === false && result.error !== '后端未返回插件动作结果：请确认宿主后端已启动，或稍后重试。') {
          setStatus(result.error || '无法打开任务日志', true)
        }
      })
    })
    referenceInput.addEventListener('change', function () {
      var files = Array.prototype.slice.call(referenceInput.files || [])
      saveReferenceFiles(files).then(function () {
        setStatus('参考图已保存，将作为后续请求的最后一张参考图', false)
      }).catch(function (error) {
        setStatus(error.message || '参考图处理失败', true)
      })
      referenceInput.value = ''
    })
    document.getElementById('clearReferenceImages').addEventListener('click', function () {
      if (!sdkReady) return
      PluginSDK.sendAction('clear_configured_references', {}, { timeoutMs: 10000 }).then(function (result) {
        if (!result || result.ok === false) throw new Error((result && result.error) || '清空参考图失败')
        renderReferenceList(result && result.images)
        setStatus('已清空参考图，后续请求不携带参考图', false)
      }).catch(function (error) { setStatus(error.message || '清空参考图失败', true) })
    })
    PluginSDK.onAction('save_param', function (result) {
      if (result && result.ok === false) setStatus(result.error || '配置保存失败', true)
    })
    PluginSDK.onAction('get_configured_references', function (result) {
      if (result && result.ok) renderReferenceList(result.images)
    })
    PluginSDK.onAction('save_configured_references', function (result) {
      if (result && result.ok) renderReferenceList(result.images)
    })
    PluginSDK.onAction('clear_configured_references', function (result) {
      if (result && result.ok) renderReferenceList(result.images)
    })
    PluginSDK.onAction('open_task_logs', function (result) {
      if (result && result.ok === false) setStatus(result.error || '无法打开任务日志', true)
    })
    PluginSDK.onReady(function (params) {
      sdkReady = true
      applyParams(params)
      refreshReferenceList().catch(function () { renderReferenceList([]) })
    })
  </script>
</body>
</html>
